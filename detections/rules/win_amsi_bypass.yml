title: PowerShell AMSI Bypass - Tampering With AmsiUtils Fields or Patching AmsiScanBuffer
id: 003cef61-fc1a-4936-81f3-57e085ae2721
status: test
description: >
  Detects PowerShell that disables AMSI (Antimalware Scan Interface) rather
  than just mentioning it. Three techniques: (1) writing to the internal
  AmsiUtils fields amsiInitFailed / amsiContext, (2) loading amsi.dll and
  resolving AmsiScanBuffer to patch it in memory, (3) building the string
  "AMSI" from single characters to dodge string matching. A script that only
  reads AMSI state is not flagged.
author: Kgosi Ntshingila
date: 2026-06-18
modified: 2026-10-21
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  product: windows
  service: powershell
  definition: 'Requires: PowerShell Script Block Logging (Event ID 4104). Group Policy: Turn on PowerShell Script Block Logging.'
detection:
  amsi_field:
    ScriptBlockText|contains:
      - 'amsiInitFailed'
      - 'amsiContext'
  field_write:
    ScriptBlockText|contains:
      - 'SetValue('
      - '= $true'
      - '=$true'
      - '= $null'
      - '=$null'
  selection_patch_scanbuffer:
    ScriptBlockText|contains|all:
      - 'amsi.dll'
      - 'AmsiScanBuffer'
      - 'GetProcAddress'
  selection_split_string:
    ScriptBlockText|re|i: "['\"]a['\"]\\s*\\+\\s*['\"]m['\"]\\s*\\+\\s*['\"]s['\"]\\s*\\+\\s*['\"]i['\"]"
  condition: (amsi_field and field_write) or 1 of selection_*
falsepositives:
  - Red team or security research tooling run on purpose in a lab
level: high
references:
  - https://attack.mitre.org/techniques/T1685/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_amsi_bypass_pattern_nov22.yml
  - https://learn.microsoft.com/en-us/windows/win32/amsi/antimalware-scan-interface-portal
