title: Windows Failed Logon (Event ID 4625)
id: 0680ddb7-60b7-43bf-8185-486b29c1bdd9
name: win_failed_logon_4625
status: test
description: >
  A single failed logon. Not an alert on its own: it is the building block
  for the brute-force correlation rule in this file.
author: Kgosi Ntshingila
date: 2024-01-15
modified: 2026-10-21
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.t1110.003
logsource:
  product: windows
  service: security
  definition: 'Requirements: Audit Logon failure auditing enabled (Event ID 4625)'
detection:
  selection:
    EventID: 4625
  filter_anon:
    TargetUserName: 'ANONYMOUS LOGON'
  filter_machine:
    TargetUserName|endswith: '$'
  condition: selection and not filter_anon and not filter_machine
fields:
  - TargetUserName
  - IpAddress
  - LogonType
  - WorkstationName
falsepositives:
  - Users mistyping passwords
level: informational
---
title: Windows Brute Force / Password Spraying - 10+ Failed Logons From One IP in 5 Minutes
id: 450f0906-e112-401e-8ce0-130b3153cce2
status: test
description: >
  Ten or more failed logons (Event ID 4625) from the same source IP within
  five minutes. Many different usernames from one IP points to password
  spraying (T1110.003); one username many times points to guessing (T1110.001).
author: Kgosi Ntshingila
date: 2024-01-15
modified: 2026-10-21
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.t1110.003
correlation:
  type: event_count
  rules:
    - win_failed_logon_4625
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - A service account with an expired password retrying from one host
  - A misconfigured application or scanner on the internal network
level: medium
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4625
