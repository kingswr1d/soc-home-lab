title: RDP Brute Force Burst - 5+ Failed RDP Logons for One Account From One IP
id: 4f045fb3-f1b4-417c-beb3-cb580f5614af
name: win_rdp_failed_burst
status: test
description: Five or more failed RDP logons for the same account from the same IP within five minutes.
author: Kgosi Ntshingila
date: 2026-06-18
modified: 2026-10-21
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - win_rdp_failed_logon
  group-by:
    - IpAddress
    - TargetUserName
  timespan: 5m
  condition:
    gte: 5
level: medium
---
title: RDP Brute Force Followed by Successful Logon
id: f7690f27-006b-41e9-9a4f-7e094781d13e
status: test
description: >
  A burst of 5+ failed RDP logons for one account from one IP, followed by a
  successful RDP logon for the same account from the same IP within five
  minutes. The attacker probably guessed the password: treat the account as
  compromised.
author: Kgosi Ntshingila
date: 2026-06-18
modified: 2026-10-21
tags:
  - attack.credential-access
  - attack.t1110.001
  - attack.initial-access
  - attack.t1078
correlation:
  type: temporal_ordered
  rules:
    - win_rdp_failed_burst
    - win_rdp_successful_logon
  group-by:
    - IpAddress
    - TargetUserName
  timespan: 5m
falsepositives:
  - A user who forgot their password, tried five times, then remembered it
level: high
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624
